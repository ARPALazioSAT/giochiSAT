<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quizzone Live - Regia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blu:#1d4ed8;--verde:#16a34a;--rosso:#dc2626;--testo:#17304f;--muted:#62748b;--bordo:#dce8f6;--cielo:#e8f5ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--cielo),#fff);font-family:Nunito,system-ui,sans-serif;color:var(--testo);min-height:100vh}.wrap{max-width:920px;margin:auto;padding:22px 18px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.brand img{width:60px;height:60px;object-fit:contain;background:white;border-radius:10px}.brand h1{font:700 28px Fredoka;margin:0}.brand p{margin:2px 0 0;font-weight:800;color:var(--muted)}.card{background:#fff;border:1.5px solid var(--bordo);border-radius:24px;padding:22px;box-shadow:0 14px 35px rgba(39,77,120,.1);margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.status{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.s{background:#f7fbff;border:1.5px solid var(--bordo);border-radius:16px;padding:14px;text-align:center}.s b{display:block;font:700 28px Fredoka;color:var(--blu)}.s span{font-weight:800;color:var(--muted);font-size:13px}.password{display:flex;gap:10px}.password input{flex:1;border:2px solid var(--bordo);border-radius:14px;padding:14px;font:700 16px Nunito}.btn{border:0;border-radius:16px;padding:15px 18px;font:700 17px Fredoka;cursor:pointer;background:var(--blu);color:#fff}.btn.green{background:var(--verde)}.btn.red{background:var(--rosso)}.btn.gray{background:#64748b}.btn:disabled{opacity:.45;cursor:not-allowed}.msg{padding:12px 14px;border-radius:14px;background:#eef6ff;color:#1e40af;font-weight:800;margin-top:12px}.warn{background:#fff7ed;color:#9a3412}.danger{background:#fef2f2;color:#991b1b}.q{font:700 24px Fredoka;margin:0 0 8px}.muted{color:var(--muted);font-weight:700}.links a{display:block;margin:6px 0;color:var(--blu);font-weight:800;word-break:break-all}@media(max-width:700px){.grid,.status{grid-template-columns:1fr 1fr}.password{flex-direction:column}}
</style></head><body><div class="wrap">
<div class="brand"><img src="../assets/logo-arpa-lazio.jpg" alt="ARPA Lazio"><div><h1>Regia Quizzone Live</h1><p>Servizio Attività Produttive e Controlli</p></div></div>
<div class="card"><div class="password"><input id="pwd" type="password" placeholder="Password della regia" autocomplete="current-password"><button class="btn gray" id="toggle">Mostra</button></div><div class="msg">La password resta nel browser e non è scritta nel codice della pagina.</div></div>
<div class="card"><div class="status"><div class="s"><b id="st">—</b><span>Stato</span></div><div class="s"><b id="cq">0</b><span>Domanda</span></div><div class="s"><b id="pp">0</b><span>Partecipanti</span></div><div class="s"><b id="aa">0</b><span>Risposte</span></div></div></div>
<div class="card"><h2 class="q" id="qtitle">In attesa</h2><p class="muted" id="qtext">Avvia il Quizzone quando i partecipanti sono collegati.</p></div>
<div class="card grid"><button class="btn green" id="start">Avvia Quizzone</button><button class="btn" id="close">Chiudi risposte</button><button class="btn" id="next">Prossima domanda</button><button class="btn red" id="finish">Termina Quizzone</button></div>
<div class="card"><button class="btn gray" id="reset">Reset per una nuova partita</button><div id="msg"></div></div>
<div class="card links"><b>Link utili</b><a target="_blank" href="../quizzone-monitor/">Apri monitor pubblico</a><a target="_blank" href="../quizzone/">Apri pagina partecipanti</a></div>
</div><script>
const SUPABASE_URL='https://tbjbtghzzqfximtjhutk.supabase.co';const SUPABASE_KEY='sb_publishable_uzkoqY4PTm6VSd1fugUuPQ_VHb-wEVS';const SESSION_CODE='ARPA2026';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let questions=[];let state=null;const $=id=>document.getElementById(id);
$('toggle').onclick=()=>{const p=$('pwd');p.type=p.type==='password'?'text':'password';$('toggle').textContent=p.type==='password'?'Mostra':'Nascondi';};
async function loadQuestions(){const {data}=await sb.from('quiz_questions_public').select('*').order('position');questions=data||[];}
function render(){if(!state)return;$('st').textContent=state.status;$('cq').textContent=state.current_question||0;$('pp').textContent=state.participants||0;$('aa').textContent=state.answers_received||0;const q=questions.find(x=>x.position===state.current_question);$('qtitle').textContent=q?`Domanda ${q.position} di 5`:(state.status==='finished'?'Quizzone terminato':'In attesa');$('qtext').textContent=q?q.question:(state.status==='finished'?'Sul monitor è visibile il riepilogo finale.':'Avvia il Quizzone quando i partecipanti sono collegati.');$('start').disabled=state.status!=='waiting';$('close').disabled=!(state.status==='active'&&state.question_open);$('next').disabled=!(state.status==='active'&&!state.question_open&&state.current_question<5);$('finish').disabled=!(state.status==='active'&&!state.question_open&&state.current_question===5);}
async function refresh(){const {data}=await sb.rpc('quiz_public_state',{p_session_code:SESSION_CODE});state=Array.isArray(data)?data[0]:data;render();}
async function cmd(c){const pwd=$('pwd').value;if(!pwd){$('msg').innerHTML='<div class="msg warn">Inserisci la password della regia.</div>';return;}try{const {data,error}=await sb.rpc('quiz_admin_command',{p_password:pwd,p_command:c});if(error)throw error;$('msg').innerHTML='<div class="msg">Comando eseguito.</div>';await refresh();}catch(e){$('msg').innerHTML='<div class="msg danger">Comando non eseguito. Controlla la password o lo stato del Quizzone.</div>';}}
$('start').onclick=()=>cmd('start');$('close').onclick=()=>cmd('close');$('next').onclick=()=>cmd('next');$('finish').onclick=()=>cmd('finish');$('reset').onclick=()=>{if(confirm('Il reset cancellerà partecipanti e risposte della partita corrente. Continuare?'))cmd('reset');};
(async()=>{await loadQuestions();await refresh();setInterval(refresh,1000);})();
</script></body></html>
