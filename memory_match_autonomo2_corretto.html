<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memory Match</title>
  <style>
    :root {
      --bg-1: #f39ed9;
      --bg-2: #ffd3ef;
      --bg-3: #ffffff;
      --ink: #830c0e;
      --accent: #fb64d0;
      --card-back: #ffffff;
      --panel: #ffffff;
      --radius: 18px;
      --shadow: 0 12px 28px rgba(0,0,0,.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2), var(--bg-3));
    }

    button { font: inherit; }

    .screen {
      display: none;
      min-height: 100vh;
      padding: 24px;
    }

    .screen.active { display: flex; }

    .home {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .home-card {
      width: min(720px, 100%);
      background: rgba(255,255,255,.62);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 28px;
      padding: 48px 28px;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(54px, 10vw, 120px);
      line-height: .88;
      letter-spacing: -.06em;
    }

    .subtitle {
      margin: 0 auto 28px;
      max-width: 560px;
      font-size: clamp(18px, 2.6vw, 28px);
      line-height: 1.4;
    }

    .time-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .time-option,
    .primary,
    .secondary {
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }

    .time-option {
      background: #fff;
      color: var(--ink);
      font-weight: 700;
      min-width: 80px;
    }

    .time-option.selected,
    .primary {
      background: var(--accent);
      color: #fff;
    }

    .primary,
    .secondary { font-weight: 800; }

    .secondary {
      background: transparent;
      color: var(--accent);
      border: 3px solid var(--accent);
    }

    .time-option:hover,
    .primary:hover,
    .secondary:hover { transform: translateY(-2px); filter: brightness(1.04); }

    .game {
      flex-direction: column;
      gap: 20px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      background: var(--panel);
      border-radius: 22px;
      padding: 16px 20px;
      box-shadow: var(--shadow);
    }

    .topbar h2 { margin: 0; font-size: clamp(24px, 4vw, 38px); }
    .timer { font-size: clamp(28px, 5vw, 44px); font-weight: 900; color: var(--accent); }
    .actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

    .grid-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grid {
      width: min(1120px, 100%);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .memory-card {
      position: relative;
      aspect-ratio: 4 / 3;
      perspective: 900px;
      cursor: pointer;
      border-radius: var(--radius);
      outline: none;
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
    }

    .memory-card:focus-visible { box-shadow: 0 0 0 4px rgba(251,100,208,.45); }

    .card-inner {
      display: block;
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .35s ease;
    }

    .memory-card.flipped .card-inner,
    .memory-card.matched .card-inner { transform: rotateY(180deg); }

    .card-face {
      display: block;
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: var(--radius);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: var(--shadow);
    }

    .card-back {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-back);
      color: #e4e4e4;
      font-weight: 900;
      font-size: clamp(28px, 5vw, 54px);
      border: 2px solid rgba(131,12,14,.08);
    }

    .card-front {
      transform: rotateY(180deg);
      background: #ddd;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .memory-card.matched::after {
      content: "✓";
      position: absolute;
      right: 10px;
      top: 8px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.92);
      color: var(--ink);
      font-weight: 900;
      z-index: 4;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(0,0,0,.58);
      z-index: 50;
    }

    .modal.active { display: flex; }

    .modal-box {
      width: min(420px, 100%);
      text-align: center;
      color: #fff;
      background: var(--ink);
      border-radius: 24px;
      padding: 34px 26px;
      box-shadow: var(--shadow);
    }

    .modal-box h3 { margin: 0 0 8px; font-size: 42px; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }

    @media (max-width: 760px) {
      .screen { padding: 14px; }
      .home-card { padding: 36px 18px; }
      .topbar { grid-template-columns: 1fr; text-align: center; }
      .actions { justify-content: center; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
    }
  </style>
</head>
<body>
  <main id="home-screen" class="screen home active">
    <section class="home-card">
      <h1>Memory<br>Match</h1>
      <p class="subtitle">Trova tutte le coppie prima che il tempo finisca.</p>
      <div class="time-options" aria-label="Seleziona il tempo">
        <button class="time-option" data-time="30">30 s</button>
        <button class="time-option selected" data-time="60">60 s</button>
        <button class="time-option" data-time="90">90 s</button>
      </div>
      <button id="start-btn" class="primary">Inizia il gioco</button>
    </section>
  </main>

  <section id="game-screen" class="screen game">
    <header class="topbar">
      <h2>Memory Match</h2>
      <div id="timer" class="timer">1:00</div>
      <div class="actions">
        <button id="restart-btn" class="primary">Ricomincia</button>
        <button id="home-btn" class="secondary">Home</button>
      </div>
    </header>
    <div class="grid-wrap">
      <div id="grid" class="grid" aria-label="Griglia del memory"></div>
    </div>
  </section>

  <div id="result-modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h3 id="result-title"></h3>
      <p id="result-text"></p>
      <div class="modal-actions">
        <button id="play-again-btn" class="primary">Gioca ancora</button>
        <button id="modal-home-btn" class="secondary">Home</button>
      </div>
    </div>
  </div>

  <script>
    // SOSTITUISCI QUI LE IMMAGINI.
    // Puoi usare file locali nella stessa cartella, ad esempio: "immagini/lago-vico.jpg"
    // oppure URL pubblici completi.
    const imageSet = [
      { src: "immagini/1.jpg", alt: "Immagine 1" },
      { src: "immagini/2.jpg", alt: "Immagine 2" },
      { src: "immagini/3.jpg", alt: "Immagine 3" },
      { src: "immagini/4.jpg", alt: "Immagine 4" },
      { src: "immagini/5.jpg", alt: "Immagine 5" },
      { src: "immagini/6.jpg", alt: "Immagine 6" },
      { src: "immagini/7.jpg", alt: "Immagine 7" },
      { src: "immagini/8.jpg", alt: "Immagine 8" }
    ];

    let selectedTime = 60;
    let timeRemaining = 60;
    let timerId = null;
    let firstCard = null;
    let secondCard = null;
    let locked = false;
    let matched = 0;

    const homeScreen = document.getElementById("home-screen");
    const gameScreen = document.getElementById("game-screen");
    const grid = document.getElementById("grid");
    const timer = document.getElementById("timer");
    const modal = document.getElementById("result-modal");
    const resultTitle = document.getElementById("result-title");
    const resultText = document.getElementById("result-text");

    document.querySelectorAll(".time-option").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".time-option").forEach(b => b.classList.remove("selected"));
        button.classList.add("selected");
        selectedTime = Number(button.dataset.time);
      });
    });

    document.getElementById("start-btn").addEventListener("click", startGame);
    document.getElementById("restart-btn").addEventListener("click", startGame);
    document.getElementById("play-again-btn").addEventListener("click", startGame);
    document.getElementById("home-btn").addEventListener("click", goHome);
    document.getElementById("modal-home-btn").addEventListener("click", goHome);

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function showScreen(screen) {
      homeScreen.classList.remove("active");
      gameScreen.classList.remove("active");
      screen.classList.add("active");
    }

    function startGame() {
      clearInterval(timerId);
      modal.classList.remove("active");
      timeRemaining = selectedTime;
      firstCard = null;
      secondCard = null;
      locked = false;
      matched = 0;
      buildGrid();
      updateTimer();
      showScreen(gameScreen);
      timerId = setInterval(() => {
        timeRemaining -= 1;
        updateTimer();
        if (timeRemaining <= 0) endGame(false);
      }, 1000);
    }

    function buildGrid() {
      grid.innerHTML = "";
      const deck = shuffle(imageSet.flatMap((image, pairId) => [
        { ...image, pairId, uid: `${pairId}-a` },
        { ...image, pairId, uid: `${pairId}-b` }
      ]));

      deck.forEach((cardData, index) => {
        const card = document.createElement("button");
        card.className = "memory-card";
        card.type = "button";
        card.dataset.pairId = cardData.pairId;
        card.dataset.uid = cardData.uid;
        card.setAttribute("aria-label", "Carta coperta");
        card.innerHTML = `
          <span class="card-inner">
            <span class="card-face card-back">${index + 1}</span>
            <span class="card-face card-front">
              <img src="${cardData.src}" alt="${cardData.alt}"
                   onerror="this.style.display='none'; this.parentElement.textContent='Immagine non trovata'; console.error('Immagine non trovata:', this.src);">
            </span>
          </span>`;
        card.addEventListener("click", () => flipCard(card));
        grid.appendChild(card);
      });
    }

    function flipCard(card) {
      if (locked || card.classList.contains("flipped") || card.classList.contains("matched")) return;
      card.classList.add("flipped");
      card.setAttribute("aria-label", "Carta scoperta");

      if (!firstCard) {
        firstCard = card;
        return;
      }

      secondCard = card;
      locked = true;

      if (firstCard.dataset.pairId === secondCard.dataset.pairId) {
        setTimeout(() => {
          firstCard.classList.add("matched");
          secondCard.classList.add("matched");
          matched += 1;
          resetTurn();
          if (matched === imageSet.length) endGame(true);
        }, 350);
      } else {
        setTimeout(() => {
          firstCard.classList.remove("flipped");
          secondCard.classList.remove("flipped");
          firstCard.setAttribute("aria-label", "Carta coperta");
          secondCard.setAttribute("aria-label", "Carta coperta");
          resetTurn();
        }, 850);
      }
    }

    function resetTurn() {
      firstCard = null;
      secondCard = null;
      locked = false;
    }

    function updateTimer() {
      const minutes = Math.floor(timeRemaining / 60);
      const seconds = String(timeRemaining % 60).padStart(2, "0");
      timer.textContent = `${minutes}:${seconds}`;
    }

    function endGame(won) {
      clearInterval(timerId);
      locked = true;
      resultTitle.textContent = won ? "Hai vinto!" : "Tempo scaduto";
      resultText.textContent = won
        ? `Hai trovato tutte le coppie con ${timeRemaining} secondi rimasti.`
        : `Hai trovato ${matched} coppie su ${imageSet.length}.`;
      modal.classList.add("active");
    }

    function goHome() {
      clearInterval(timerId);
      modal.classList.remove("active");
      showScreen(homeScreen);
    }
  </script>
</body>
</html>
